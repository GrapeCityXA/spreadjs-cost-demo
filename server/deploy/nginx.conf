server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com;
    root /srv/cost-report/dist;
    index index.html;
    client_max_body_size 50m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = / {
        add_header Cache-Control "no-store" always;
        return 302 /guide$is_args$args;
    }

    # SPA navigation resolves here. Never cache the HTML entry point:
    # it selects the versioned scripts and therefore the application's routes.
    location = /index.html {
        try_files $uri =404;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ^~ /collaboration {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location = /health { proxy_pass http://127.0.0.1:3000/health; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /fonts/ { try_files $uri =404; expires 7d; }
    location ~ /\. { deny all; }
}
