<title>SpreadJS 演示取舍清单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #f4f6f5;
    --surface: #ffffff;
    --surface-soft: #eef1ef;
    --ink: #182019;
    --muted: #5c6a61;
    --faint: #8b968e;
    --line: #dbe1dc;
    --line-strong: #c3ccc5;
    --accent: #146356;
    --accent-ink: #0d4a40;
    --accent-soft: #e2efe9;
    --warn: #9a5a12;
    --warn-soft: #f6ecdd;
    --crit: #9c352a;
    --crit-soft: #f7e6e3;
    --info: #35597f;
    --info-soft: #e6edf4;
    --shadow: 0 1px 2px rgba(24, 32, 25, .06), 0 8px 24px rgba(24, 32, 25, .05);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121714;
      --surface: #19201c;
      --surface-soft: #202923;
      --ink: #e6ece7;
      --muted: #9faea4;
      --faint: #7c8b81;
      --line: #2c3730;
      --line-strong: #3d4a42;
      --accent: #6fc7b4;
      --accent-ink: #a5e0d2;
      --accent-soft: #1c332d;
      --warn: #d9a15f;
      --warn-soft: #32271a;
      --crit: #e08c80;
      --crit-soft: #35211e;
      --info: #8db2d6;
      --info-soft: #1c2833;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --ground: #121714;
    --surface: #19201c;
    --surface-soft: #202923;
    --ink: #e6ece7;
    --muted: #9faea4;
    --faint: #7c8b81;
    --line: #2c3730;
    --line-strong: #3d4a42;
    --accent: #6fc7b4;
    --accent-ink: #a5e0d2;
    --accent-soft: #1c332d;
    --warn: #d9a15f;
    --warn-soft: #32271a;
    --crit: #e08c80;
    --crit-soft: #35211e;
    --info: #8db2d6;
    --info-soft: #1c2833;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 132px;
  }

  /* ---------- header ---------- */
  .masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 24px;
    align-items: end;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line-strong);
  }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-family: Archivo, "Microsoft YaHei", sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 3.4vw, 38px);
    line-height: 1.12;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }
  .lede {
    max-width: 62ch;
    margin: 10px 0 0;
    color: var(--muted);
  }
  .tally {
    display: flex;
    gap: 22px;
    align-items: flex-end;
    font-variant-numeric: tabular-nums;
  }
  .tally div { text-align: right; }
  .tally span {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 2px;
  }
  .tally strong {
    font-family: Archivo, sans-serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }
  .tally .kept strong { color: var(--accent); }
  .tally .cut strong { color: var(--crit); }

  .progress {
    grid-column: 1 / -1;
    height: 4px;
    background: var(--surface-soft);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress > i {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--accent);
    transition: width .18s ease;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin: 18px 0 6px;
    padding: 10px 0;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  .search {
    flex: 1 1 260px;
    min-width: 200px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: var(--faint);
    fill: none;
    stroke-width: 2;
  }
  .seg {
    display: inline-flex;
    padding: 3px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 5px 12px;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
  }
  .seg button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--ground);
  }
  .seg button:focus-visible, .ghost:focus-visible, .copy:focus-visible, .module-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .ghost {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .ghost:hover { color: var(--ink); border-color: var(--faint); }

  /* ---------- layout ---------- */
  .workspace {
    display: grid;
    grid-template-columns: 208px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  .index {
    position: sticky;
    top: 66px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .index h2 {
    margin: 0 0 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 500;
  }
  .index ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .index a {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
  }
  .index a:hover { background: var(--surface-soft); color: var(--ink); }
  .index a b { font-weight: 500; }
  .index a span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .index a.has-cut span { color: var(--crit); }

  /* ---------- modules ---------- */
  main { display: grid; gap: 22px; min-width: 0; }
  .module {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    scroll-margin-top: 72px;
  }
  .module-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface), var(--surface-soft));
  }
  .module-key {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: .08em;
  }
  .module-head h2 {
    margin: 0;
    font-family: Archivo, "Microsoft YaHei", sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.005em;
  }
  .module-head .count {
    margin-left: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .module-toggle {
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11px;
    cursor: pointer;
  }
  .module-toggle:hover { color: var(--ink); }

  .items { display: grid; }
  .item {
    display: grid;
    grid-template-columns: 22px 56px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: start;
    padding: 11px 18px;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .items .item:first-child { border-top: 0; }
  .item:hover { background: var(--surface-soft); }
  .item input[type="checkbox"] {
    appearance: none;
    width: 17px;
    height: 17px;
    margin: 2px 0 0;
    border: 1.5px solid var(--line-strong);
    border-radius: 4px;
    background: var(--surface);
    display: grid;
    place-content: center;
    cursor: pointer;
    flex: none;
  }
  .item input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .item input[type="checkbox"]:checked::after {
    content: "";
    width: 9px;
    height: 5px;
    border-left: 2px solid var(--surface);
    border-bottom: 2px solid var(--surface);
    transform: translateY(-1px) rotate(-45deg);
  }
  .item input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item.cut .name { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--faint); }
  .item.cut .desc { color: var(--faint); }
  .id {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--faint);
    padding-top: 2px;
    letter-spacing: .03em;
  }
  .name {
    font-weight: 500;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .desc {
    display: block;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.45;
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: flex-end;
    max-width: 240px;
  }
  .chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .04em;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .chip.ok { color: var(--accent); background: var(--accent-soft); }
  .chip.warn { color: var(--warn); background: var(--warn-soft); }
  .chip.info { color: var(--info); background: var(--info-soft); }
  .chip.back { color: var(--faint); background: var(--surface-soft); border-color: var(--line); }
  .chip.cap { color: var(--muted); background: transparent; border-color: var(--line-strong); }
  .chip.v-high { color: var(--accent-ink); background: var(--accent-soft); }
  .chip.v-mid { color: var(--muted); background: var(--surface-soft); }
  .chip.v-low { color: var(--faint); background: transparent; border-color: var(--line); }

  .empty {
    padding: 40px 18px;
    text-align: center;
    color: var(--muted);
  }

  /* ---------- footer ---------- */
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    border-top: 1px solid var(--line-strong);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(10px);
  }
  .dock-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .dock .stat {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .dock .stat b { color: var(--ink); font-weight: 500; }
  .dock .stat .cut { color: var(--crit); }
  .dock-spacer { flex: 1; }
  .copy {
    border: 0;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    padding: 9px 16px;
    font-weight: 500;
    cursor: pointer;
  }
  :root[data-theme="dark"] .copy { color: #10201b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .copy { color: #10201b; }
  }
  .copy:hover { background: var(--accent-ink); }
  .copy:active { transform: translateY(1px); }
  .output {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 12px;
    display: none;
  }
  .output.open { display: block; }
  body.has-output .page { padding-bottom: 260px; }
  .output textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface-soft);
    color: var(--ink);
    padding: 10px 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .notes {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 12px;
  }
  .notes label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .notes textarea {
    width: 100%;
    min-height: 48px;
    resize: vertical;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    padding: 9px 12px;
  }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
    .index { position: static; }
    .index ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .masthead { grid-template-columns: 1fr; }
    .tally { justify-content: flex-start; }
  }
  @media (max-width: 620px) {
    .page { padding: 20px 14px 150px; }
    .item { grid-template-columns: 22px 44px minmax(0, 1fr); }
    .chips { grid-column: 2 / -1; justify-content: flex-start; max-width: none; }
    .dock-inner { padding: 10px 14px; }
    .output, .notes { padding-inline: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="page">
  <header class="masthead">
    <div>
      <p class="eyebrow">Showcase scope review</p>
      <h1>官网演示要留什么</h1>
      <p class="lede">这份清单把项目里能拆出来的功能全部列出（业务能力、协同与社交、平台能力）。默认全部勾选为“保留”；把不想要的取消勾选，最后点底部按钮生成一份可回传的取舍结果。</p>
    </div>
    <div class="tally" aria-live="polite">
      <div class="kept"><span>保留</span><strong id="keptCount">0</strong></div>
      <div class="cut"><span>移除</span><strong id="cutCount">0</strong></div>
      <div><span>合计</span><strong id="totalCount">0</strong></div>
    </div>
    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="search" type="search" placeholder="搜索功能、模块或说明…" aria-label="搜索功能">
    </div>
    <div class="seg" role="group" aria-label="筛选">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="kept" aria-pressed="false">保留</button>
      <button type="button" data-filter="cut" aria-pressed="false">已移除</button>
    </div>
    <button type="button" class="ghost" id="reset">恢复默认</button>
  </div>

  <div class="workspace">
    <aside class="index" aria-label="模块索引">
      <h2>模块</h2>
      <ol id="indexList"></ol>
    </aside>
    <main id="modules"></main>
  </div>
</div>

<footer class="dock">
  <div class="output" id="output"><textarea id="result" readonly aria-label="生成的取舍结果"></textarea></div>
  <div class="notes">
    <label for="notes">补充说明（可选，会一起保存）</label>
    <textarea id="notes" placeholder="例如：季度考核整体不要；协同演示希望保留双窗口；登录必须保留…"></textarea>
  </div>
  <div class="dock-inner">
    <span class="stat">保留 <b id="dockKept">0</b> · 移除 <b class="cut" id="dockCut">0</b></span>
    <span class="dock-spacer"></span>
    <button type="button" class="ghost" id="clearAll">全部清空</button>
    <button type="button" class="copy" id="copy">生成并复制结果</button>
  </div>
</footer>

<script>
const MODULES = [
  { key: 'A', title: '门户与导航', items: [
    { id: 'A01', name: '登录页', desc: '账号密码登录 + 6 个演示账号一键登录', status: 'ok', value: '高' },
    { id: 'A02', name: '免登录游客进入', desc: '当前没有，需要新增的官网入口方式', status: 'new', value: '高' },
    { id: 'A03', name: '门户首页', desc: '账号、角色、待办入口、无权限提示', status: 'ok', value: '中' },
    { id: 'A04', name: '项目导览 Guide', desc: '8 步业务故事 + 8 段录屏 + 官方文档链接', status: 'ok', value: '高' },
    { id: 'A05', name: '侧栏导航与面包屑', desc: '菜单可见性、当前页高亮、用户菜单', status: 'ok', value: '高' },
    { id: 'A06', name: '流程中心：待办 / 我发起 / 我办结', desc: '把各类业务事项聚合成列表', status: 'ok', value: '中' },
    { id: 'A07', name: '流程中心：流程管理', desc: '管理视角的总览列表', status: 'ok', value: '低' },
    { id: 'A08', name: '流程中心：发起流程', desc: '5 类业务卡片入口（周期、字段、规则、模板、报表）', status: 'ok', value: '低' },
    { id: 'A09', name: '顶部通知铃铛', desc: '流程事件站内通知 + WebSocket 实时刷新', status: 'ok', value: '中' },
    { id: 'A10', name: '旧版路由重定向提示', desc: '旧地址自动跳新页面并提示', status: 'ok', value: '低' }
  ]},
  { key: 'B', title: '模板与组件', items: [
    { id: 'B01', name: 'Excel 直接导入为模板', desc: '把已有 xlsx 表样带进浏览器继续设计', status: 'ok', value: '高', cap: 'Excel IO' },
    { id: 'B02', name: '空白工作簿设计', desc: '从零开始搭表样', status: 'ok', value: '中', cap: 'Designer' },
    { id: 'B03', name: '组件库（表头 / 表体 / 表尾）', desc: '可复用组件及其版本', status: 'ok', value: '中' },
    { id: 'B04', name: '组件组合成模板', desc: '把组件拖进模板拼装完整表样', status: 'ok', value: '中' },
    { id: 'B05', name: '模板 / 组件版本链', desc: '新建版本、历史版本追溯', status: 'ok', value: '低' },
    { id: 'B06', name: '发布检查', desc: '结构、映射、权限、公式的发布前校验', status: 'ok', value: '中' },
    { id: 'B07', name: '模板提交审核与批准 / 退回', desc: '设计者提交，管理员审批', status: 'ok', value: '低' },
    { id: 'B08', name: '设计器完整 Ribbon', desc: '开始、插入、页面布局、公式、数据、视图、设置', status: 'ok', value: '高', cap: 'Designer' },
    { id: 'B09', name: '字段拖入与单元格绑定', desc: '从字段目录拖字段到单元格并建立映射', status: 'ok', value: '高', cap: 'DataManager' },

const STORAGE_KEY = 'spreadjs-showcase-inventory-v1';
const allItems = MODULES.flatMap(m => m.items);
const state = { kept: new Set(allItems.map(i => i.id)), filter: 'all', query: '' };

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Array.isArray(saved.cut)) state.kept = new Set(allItems.map(i => i.id).filter(id => !saved.cut.includes(id)));
    if (typeof saved.notes === 'string') document.getElementById('notes').value = saved.notes;
  } catch {}
}
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      cut: allItems.filter(i => !state.kept.has(i.id)).map(i => i.id),
      notes: document.getElementById('notes').value
    }));
  } catch {}
}

const statusMeta = {
  ok: { cls: 'ok', label: '已实现' },
  warn: { cls: 'warn', label: '未接线' },
  new: { cls: 'info', label: '需新增' },
  back: { cls: 'back', label: '后台' }
};
const valueCls = { '高': 'v-high', '中': 'v-mid', '低': 'v-low' };

function matches(item, module) {
  const q = state.query.trim().toLowerCase();
  if (q) {
    const hay = (item.id + ' ' + item.name + ' ' + item.desc + ' ' + module.title + ' ' + (item.cap || '')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (state.filter === 'kept') return state.kept.has(item.id);
  if (state.filter === 'cut') return !state.kept.has(item.id);
  return true;
}

function render() {
  const host = document.getElementById('modules');
  host.innerHTML = '';
  let visible = 0;
  MODULES.forEach(module => {
    const items = module.items.filter(item => matches(item, module));
    if (!items.length) return;
    visible += items.length;
    const keptInModule = module.items.filter(i => state.kept.has(i.id)).length;

    const section = document.createElement('section');
    section.className = 'module';
    section.id = 'module-' + module.key;

    const head = document.createElement('div');
    head.className = 'module-head';
    head.innerHTML = '<span class="module-key">' + module.key + '</span>'
      + '<h2>' + module.title + '</h2>'
      + '<span class="count">' + keptInModule + ' / ' + module.items.length + ' 保留</span>';
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'module-toggle';
    const allKept = keptInModule === module.items.length;
    toggle.textContent = allKept ? '整组移除' : '整组保留';
    toggle.addEventListener('click', () => {
      module.items.forEach(i => allKept ? state.kept.delete(i.id) : state.kept.add(i.id));
      save(); render();
    });
    head.appendChild(toggle);
    section.appendChild(head);

    const list = document.createElement('div');
    list.className = 'items';
    items.forEach(item => {
      const kept = state.kept.has(item.id);
      const row = document.createElement('label');
      row.className = 'item' + (kept ? '' : ' cut');
      row.htmlFor = 'cb-' + item.id;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'cb-' + item.id;
      cb.checked = kept;
      cb.setAttribute('aria-label', '保留：' + item.name);
      cb.addEventListener('change', () => {
        cb.checked ? state.kept.add(item.id) : state.kept.delete(item.id);
        save(); render();
      });

      const id = document.createElement('span');
      id.className = 'id';
      id.textContent = item.id;

      const body = document.createElement('span');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = item.desc;
      body.appendChild(name);
      body.appendChild(desc);

      const chips = document.createElement('span');
      chips.className = 'chips';
      const st = statusMeta[item.status] || statusMeta.ok;
      const chipStatus = document.createElement('span');
      chipStatus.className = 'chip ' + st.cls;
      chipStatus.textContent = st.label;
      chips.appendChild(chipStatus);
      const chipValue = document.createElement('span');
      chipValue.className = 'chip ' + (valueCls[item.value] || 'v-mid');
      chipValue.textContent = '价值 ' + item.value;
      chips.appendChild(chipValue);
      if (item.cap) {
        const chipCap = document.createElement('span');
        chipCap.className = 'chip cap';
        chipCap.textContent = item.cap;
        chips.appendChild(chipCap);
      }

      row.appendChild(cb);
      row.appendChild(id);
      row.appendChild(body);
      row.appendChild(chips);
      list.appendChild(row);
    });
    section.appendChild(list);
    host.appendChild(section);
  });

  if (!visible) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = state.query ? '没有匹配的功能，换个关键词试试。' : '当前筛选下没有条目。';
    host.appendChild(empty);
  }

  renderIndex();
  renderCounts();
}

function renderIndex() {
  const list = document.getElementById('indexList');
  list.innerHTML = '';
  MODULES.forEach(module => {
    const kept = module.items.filter(i => state.kept.has(i.id)).length;
    const cut = module.items.length - kept;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#module-' + module.key;
    a.className = cut ? 'has-cut' : '';
    a.innerHTML = '<b>' + module.title + '</b><span>' + kept + '/' + module.items.length + '</span>';
    li.appendChild(a);
    list.appendChild(li);
  });
}

function renderCounts() {
  const kept = state.kept.size;
  const total = allItems.length;
  const cut = total - kept;
  const pct = Math.round(kept / total * 100);
  document.getElementById('keptCount').textContent = kept;
  document.getElementById('cutCount').textContent = cut;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('dockKept').textContent = kept;
  document.getElementById('dockCut').textContent = cut;
  document.getElementById('progressBar').style.width = pct + '%';
}

function buildResult() {
  const kept = allItems.filter(i => state.kept.has(i.id)).map(i => i.id);
  const cut = allItems.filter(i => !state.kept.has(i.id)).map(i => i.id);
  const lines = [];
  lines.push('保留（' + kept.length + '）：' + (kept.join(' ') || '无'));
  lines.push('移除（' + cut.length + '）：' + (cut.join(' ') || '无'));
  const notes = document.getElementById('notes').value.trim();
  if (notes) lines.push('补充说明：' + notes);
  return lines.join('\n');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.getElementById('result');
    ta.focus();
    ta.select();
    try { return document.execCommand('copy'); } catch { return false; }
  }
}

document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value;
  render();
});
document.querySelectorAll('.seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.filter = btn.dataset.filter;
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  });
});
document.getElementById('clearAll').addEventListener('click', () => {
  state.kept.clear();
  save(); render();
});
document.getElementById('reset').addEventListener('click', () => {
  state.kept = new Set(allItems.map(i => i.id));
  document.getElementById('notes').value = '';
  save(); render();
});
document.getElementById('notes').addEventListener('input', save);
document.getElementById('copy').addEventListener('click', async () => {
  const text = buildResult();
  const box = document.getElementById('output');
  box.classList.add('open');
  document.body.classList.add('has-output');
  document.getElementById('result').value = text;
  const ok = await copyText(text);
  const btn = document.getElementById('copy');
  const original = btn.textContent;
  btn.textContent = ok ? '已复制，可直接粘贴回传' : '已生成，请手动复制';
  setTimeout(() => { btn.textContent = original; }, 2200);
});

load();
render();
</script>
